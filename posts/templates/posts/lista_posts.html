{% extends "base.html" %}

{% block title %} Inicio | Mi Blog {% endblock %}

{% block  content %}
    <h2>Listado de posts</h2>
    <ul>
        {% for post in posts %}
            <li><a href="{% url 'detalle_post' post.id %}">{{ post.titulo }}</a> - {{ post.autor }}</li>
        {% endfor %}
    </ul>
{% endblock %}
