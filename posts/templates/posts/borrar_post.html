{% extends "base.html" %}

{% block title %}Borrar post{% endblock %}

{% block content %}
    <h2>Borrar post</h2>
    <form method="post" class="formulario">
        {% csrf_token %}
        <p>¿Seguro que querés borrar el post "{{ posteo.titulo }}"? Esta acción no se puede deshacer.</p>
        <button type="submit" class="boton boton-peligro">Sí, borrar</button>
        <a class="boton boton-secundario" href="{% url 'lista_posts' %}">Cancelar</a>
    </form>
{% endblock %}
