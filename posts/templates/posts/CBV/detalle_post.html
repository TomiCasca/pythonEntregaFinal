{% extends "base.html" %}

{% block title %} Detalle del Post | Mi Blog {% endblock %}

{% block content %}
    <h2>{{ posteo.titulo }}</h2>
    <p><strong>Autor:</strong> {{ posteo.autor }}</p>
    <p>{{ posteo.contenido }}</p>
    {% if posteo.imagen %}
        <img src="{{ posteo.imagen.url }}" alt="Imagen del post" height="300">
    {% endif %}
{% endblock %}
