{% extends "base.html" %}

{% block title %} Detalle del Post | Mi Blog {% endblock %}

{% block content %}
    <h2>{{ post.titulo }}</h2>
    <p><strong>Autor:</strong> {{ post.autor }}</p>
    <p>{{ post.contenido }}</p>
    {% if post.imagen %}
        <img src="{{ post.imagen.url }}" alt="Imagen del post" height="300">
    {% endif %}
{% endblock %}
