{% extends "base.html" %}

{% block title %}Registrarse{% endblock %}

{% block content %}
    <h2>Crear una cuenta</h2>
    <form method="post" class="formulario">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="boton">Registrarme</button>
    </form>
    <p>¿Ya tenés cuenta? <a href="{% url 'iniciar_sesion' %}">Iniciá sesión</a>.</p>
{% endblock %}
