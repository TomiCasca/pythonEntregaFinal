{% extends "base.html" %}

{% block title %}Iniciar sesión{% endblock %}

{% block content %}
    <h2>Iniciar sesión</h2>
    <form method="post" class="formulario">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="boton">Entrar</button>
    </form>
    <p>¿No tenés cuenta? <a href="{% url 'registrar' %}">Registrate acá</a>.</p>
{% endblock %}
